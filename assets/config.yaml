scan_path: "./projects-qa"
db_path: "./projects-qa/.qa-control/index.db"

pipeline:
  static_only: false
  max_concurrent: 10
  stage_timeouts:
    A: 60
    B: 900
    B_pull: 300
    B_build: 600
    B_up: 300
    B_health: 60
    B_port: 30
    C: 300
    D: 900
    E: 1200
    F: 900

docker:
  managed_label: "managed_by=p2rqa"
  compose_project_prefix: "p2rqa"
  keep_failed_containers_minutes: 60
  health_check_timeout_seconds: 60
  cleanup_policy: "always"
  cleanup_images: true
  cleanup_volumes: true
  cleanup_build_cache: false
  build_cache_prune_until: "24h"
  keep_runtime: false

docs:
  max_attachment_bytes: 67108864
  inline_text_limit_bytes: 1048576
  stage_inline_max_bytes: 4194304

codex:
  sandbox_image: "codex:latest"
  prompt_profiles_dir: "./projects-qa/.qa-control/prompt_profiles"
  network: "none"
  max_output_bytes: 1048576
  writable_tmp: false

tui:
  refresh_interval_ms: 100
  log_max_lines: 10000
