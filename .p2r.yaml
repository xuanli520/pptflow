codex:
    max_output_bytes: 1048576
    network: none
    prompt_profiles_dir: ./projects-qa/.qa-control/prompt_profiles
    sandbox_image: codex:latest
    writable_tmp: false
db_path: ./projects-qa/.qa-control/index.db
docker:
    compose_project_prefix: p2rqa
    daemon_mirrors:
        backup_dir: /home/purplevoid/projects/p2r_tui/p2r_tui/projects-qa/.qa-control/docker-daemon-backups
        daemon_json: /etc/docker/daemon.json
        enabled: true
        registry_mirrors: []
        require_manual_apply: false
    health_check_timeout_seconds: 60
    keep_failed_containers_minutes: 60
    managed_label: managed_by=p2rqa
pipeline:
    max_concurrent: 10
    self_test_report_path: repo/self_test_report.md
    stage_timeouts:
        A: 60
        B: 900
        B_build: 600
        B_health: 60
        B_port: 30
        B_pull: 300
        B_up: 300
        C: 300
        D: 9000
        E: 20000
        F: 10000
    static_only: false
scan_path: ./projects-qa
tui:
    log_max_lines: 10000
    refresh_interval_ms: 100
